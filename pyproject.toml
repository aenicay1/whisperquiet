[project]
name = "whisperquiet"
version = "0.1.0"
description = "Whisper-quiet dictation + camera head/gesture control for macOS"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mlx-whisper>=0.4",
    "numpy",
    "sounddevice",

    "rumps",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-AVFoundation",
    "mediapipe>=0.10",
    "opencv-python",
]

[project.optional-dependencies]
# Opt-in Parakeet TDT dictation backend (whisperquiet/parakeet.py), gated by
# config.dictation_backend == "parakeet". Also required to run the parakeet leg
# of scripts/bench_backends.py. NOT a default dependency — install explicitly:
#   pip install -e '.[parakeet]'
parakeet = ["parakeet-mlx>=0.3"]

[project.scripts]
whisperquiet = "whisperquiet.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whisperquiet*"]
